<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App Hub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="card" style="max-width: 800px;">
    <h2 style="text-align: center;">🚀 My Web App Hub</h2>
    <p style="text-align: center;">Welcome to your collection of micro-apps.</p>
</div>

<div id="menuContainer" class="menu-container">
    <!-- Apps will be loaded here dynamically -->
    <p id="loadingText" style="text-array: center; width: 100%;">Loading apps...</p>
</div>

<script>
async function loadApps() {
    const container = document.getElementById('menuContainer');
    const loadingText = document.getElementById('loadingText');

    try {
        // Fetch the manifest file
        const response = await fetch('apps.json');
        if (!response.ok) throw new Error("Could not load apps.json");
        
        const apps = await response.json();

        // Clear loading text
        container.innerHTML = '';

        if (apps.length === 0) {
            container.innerHTML = '<p>No apps found in the hub.</p>';
            return;
        }

        // Generate cards for each app
        apps.forEach(app => {
            const card = document.createElement('a');
            card.href = app.path;
            card.className = 'app-card';
            
            card.innerHTML = `
                <div class="app-icon">${app.icon || '🛠️'}</div>
                <div class="app-name">${app.name}</div>
                <div style="font-size: 0.8rem; color: #666; text-align: center;">${app.description || ''}</div>
            `;
            
            container.appendChild(card);
        });

    } catch (error) {
        console.error(error);
        container.innerHTML = `<p style="color: red;">Error loading apps: ${error.message}</p>`;
    }
}

// Start loading when page is ready
window.onload = loadApps;
</script>

</body>
</html>
