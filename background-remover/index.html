<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Pro Magic Wand - Interactive</title>
 <style>
 body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #2c2c2c; color: white; }
 .controls { background: #3d3d3:padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: center; }
 .control-group { display: flex; flex-direction: column; gap: 5px; }
 canvas { max-width: 90vw; height: auto; cursor: crosshair; border: 2px solid #555; border-radius: 4px; }

 .bg-checkerboard { background-image: linear-gradient(45deg, #444 25%, transparent 25%), linear-gradient(-45deg, #444 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #444 75%), linear-gradient(-45deg, transparent 75%, #444 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; background-color: #333; }
 .bg-black { background: black; }
 .bg-white { background: white; }

 button { padding: 8px 16px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; transition: 0:2s; }
 .btn-apply { background: #ffc107; color: #333; }
 .btn-save { background: #28a745; color: white; }
 .btn-secondary { background: #6c757d; color: white; }
 button:hover { opacity: 0.8; }
 button:disabled { background: #444; color: #777; cursor: not-allowed; }

 .coord-display { font-family: monospace; background: #222; padding: 2px 6px; border-radius: 4px; color: #00ff00; }
 .hint { width: 100%; text-align: center; color: #aaa; font-size: 0.85em; margin-top: 10px; }
 </style>
</head>
<body>

 <div class="controls">
 <div class="control-group">
 <input type="file" id="upload" accept="image/png, image/jpeg">
 </div>

 <div class="control-group">
 <label>Last Click: <span id="coord-val" class="coord-display">None</span></label>
 </div>

 <div class="control-group">

 <input type="range" id="sensitivity" min="0" max="150" value="30">
 </div>

 <div class="control-group">
 <label>Feather: <span id="feather-val">2</span></label>
 <input type="range" id="feather" min="0" max="10" value="2">
 </div>

 <div class="control-group">
 <label>Preview BG</label>
 <select id="bgSelect">
 <option value="bg-checkerboard">Checkerboard</option>
 <option value="bg-black">Black</option>
 <option value="bg-white">White</option>
 </select>
 </div>

 <div style="display: flex; gap: 10px;">
 <button id="applyBtn" class="btn-apply" disabled>Apply Change</button>
 <button id="undoBtn" class="btn-secondary" disabled>Undo</button>
 <button id="saveBtn" class="btn-save">Save PNG</button>
 </div>

 <div class="hint">Adjust sliders to preview. Click "Apply" to make it permanent.</div>
 </div>

 <canvas id="canvas" class="bg-checkerboard"></canvas>

</html>
