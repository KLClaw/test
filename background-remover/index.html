<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Pro Magic Wand - Interactive</title>
 <style>
 body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #2c2c2c; color: white; }
  .controls { background: #333; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: center; }
  .control-group { display: flex; flex-direction: column; gap: 5px; }
  canvas { max-width: 90vw; height: auto; cursor: crosshair; border: 2px solid #555; border-radius: 4px; }

  .bg-checkerboard { background-image: linear-gradient(45deg, #444 25%, transparent 25%), linear-gradient(-45deg, #444 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #444 75%), linear-gradient(-45deg, transparent 75%, #444 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; background-color: #333; }
  .bg-black { background: black; }
  .bg-white { background: white; }

  button { padding: 8px 16px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; transition: 0.2s; }
  .btn-apply { background: #ffc107; color: #333; }
  .btn-save { background: #28a745; color: white; }
  .btn-secondary { background: #6c757d; color: white; }
  button:hover { opacity: 0.8; }
  button:disabled { background: #444; color: #777; cursor: not-allowed; }

  .coord-display { font-family: monospace; background: #222; padding: 2px 6px; border-radius: 4px; color: #00ff00; }
  .hint { width: 100%; text-align: center; color: #aaa; font-size: 0.85em; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="controls">
    <div class="control-group">
      <input type="file" id="upload" accept="image/png, image/jpeg">
    </div>

    <div class="control-group">
      <label>Last Click: <span id="coord-val" class="coord-display">None</span></label>
    </div>

    <div class="control-group">
      <label>Sensitivity: <span id="sens-val">30</span></label>
      <input type="range" id="sensitivity" min="0" max="150" value="30">
    </div>

    <div class="control-group">
      <label>Feather: <span id="feather-val">2</span></label>
      <input type="range" id="feather" min="0" max="10" value="2">
    </div>

    <div class="control-group">
      <label>Preview BG</label>
      <select id="bgSelect">
        <option value="bg-checkerboard">Checkerboard</option>
        <option value="bg-black">Black</option>
        <option value="bg-white">White</option>
      </select>
    </div>

    <div style="display: flex; gap: 10px;">
      <button id="applyBtn" class="btn-apply" disabled>Apply Change</button>
      <button id="undoBtn" class="btn-secondary" disabled>Undo</button>
      <button id="saveBtn" class="btn-save" disabled>Save PNG</button>
    </div>

    <div class="hint">Adjust sliders to preview. Click "Apply" to make it permanent.</div>
  </div>

  <canvas id="canvas" class="bg-checkerboard"></canvas>

  <script>
    const upload = document.getElementById('upload');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const sensSlider = document.getElementById('sensitivity');
    const featherSlider = document.getElementById('feather');
    const bgSelect = document.getElementById('bgSelect');
    const applyBtn = document.getElementById('applyBtn');
    const undoBtn = document.getElementById('undoBtn');
    const saveBtn = document.getElementById('saveBtn');
    const coordDisp = document.getElementById('coord-val');

    let cleanImageData = null; 
    let undoStack = [];
    let lastClick = null; 
    let currentPreviewData = null;

    // --- UI Events ---
    sensSlider.oninput = () => {
      document.getElementById('sens-val').innerText = sensSlider.value;
      if (lastClick) renderPreview();
    };

    featherSlider.oninput = () => {
      document.getElementById('feather-val').innerText = featherSlider.value;
      if (lastClick) renderPreview();
    };

    bgSelect.onchange = (e) => canvas.className = e.target.value;

    upload.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          cleanImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          undoStack = [];
          lastClick = null;
          coordDisp.innerText = "None";
          applyBtn.disabled = true;
          undoBtn.disabled = true;
          saveBtn.disabled = false;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    canvas.onclick = (e) => {
      if (!cleanImageData) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = Math.floor((e.clientX - rect.left) * scaleX);
      const y = Math.floor((e.clientY - rect.top) * scaleY);

      if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) return;

      lastClick = { x, y };
      coordDisp.innerText = `X:${x}, Y:${y}`;
      applyBtn.disabled = false;
      renderPreview();
    };

    applyBtn.onclick = () => {
      if (!currentPreviewData) return;
      // Push current "clean" state to undo stack
      undoStack.push(new ImageData(
        new Uint8ClampedArray(cleanImageData.data),
        cleanImageData.width,
        cleanImageData.height
      ));
      
      // Update permanent state
      cleanImageData = currentPreviewData;
      currentPreviewData = null;
      lastClick = null;
      
      coordDisp.innerText = "None";
      applyBtn.disabled = true;
      undoBtn.disabled = false;
      
      ctx.putImageData(cleanImageData, 0, 0);
    };

    undoBtn.onclick = () => {
      if (undoStack.length === 0) return;
      cleanImageData = undoStack.pop();
      ctx.putImageData(cleanImageData, 0, 0);
      lastClick = null;
      coordDisp.innerText = "None";
      applyBtn.disabled = true;
      undoBtn.disabled = undoStack.length === 0;
    };

    saveBtn.onclick = () => {
      if (!cleanImageData) return;
      const link = document.createElement('a');
      link.download = 'removed_background.png';
      link.href = canvas.toDataURL("image/png");
      link.click();
    };

    // --- Core Logic ---

    function renderPreview() {
      if (!lastClick || !cleanImageData) return;
      
      const tempImgData = new ImageData(
        new Uint8ClampedArray(cleanImageData.data),
        cleanImageData.width,
        cleanImageData.height
      );

      currentPreviewData = processMagicWand(tempImgData, lastClick.x, lastClick.y);
      ctx.putImageData(currentPreviewData, 0, 0);
    }

    function processMagicWand(imgData, startX, startY) {
      const data = imgData.data;
      const width = imgData.width;
      const height = imgData.height;
      const threshold = parseInt(sensSlider.value);
      const featherDepth = parseInt(featherSlider.value);

      const startPos = (startY * width + startX) * 4;
      const targetR = data[startPos];
      const targetG = data[startPos + 1];
      const targetB = data[startPos + 2];

      const selected = new Uint8Array(width * height);
      const stack = [[startX, startY]];
      selected[startY * width + startX] = 1;

      // 1. Flood Fill Pass
      while (stack.length > 0) {
        const [cx, cy] = stack.pop();
        const neighbors = [[cx+1, cy], [cx-1, cy], [cx, cy+1], [cx, cy-1]];

        for (const [nx, ny] of neighbors) {
          if (nx < 0 || nx >= width || ny < 0 || ny >= height) continue;
          const idx = ny * width + nx;
          if (selected[idx]) continue;

          const pos = idx * 4;
          const dist = Math.sqrt(
            Math.pow(data[pos] - targetR, 2) +
            Math.pow(data[pos+1] - targetG, 2) +
            Math.pow(data[pos+2] - targetB, 2)
          );

          if (dist <= threshold) {
            selected[idx] = 1;
            stack.push([nx, ny]);
          }
        }
      }

      // 2. Apply Alpha (Selection + Feathering)
      if (featherDepth === 0) {
        for (let i = 0; i < selected.length; i++) {
          if (selected[i]) data[i * 4 + 3] = 0;
        }
      } else {
        // Simple feathering: if near edge of selection, fade out
        const mask = new Float32Array(width * height);
        for (let i = 0; i < selected.length; i++) mask[i] = selected[i] ? 1 : 0;

        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const idx = y * width + x;
            if (!selected[idx]) continue;
            
            // Check distance to nearest unselected pixel (very basic)
            let minDist = featherDepth;
            for (let dy = -featherDepth; dy <= featherDepth; dy++) {
              for (let dx = -featherDepth; dx <= featherDepth; dx++) {
                const nx = x + dx, ny = y + dy;
                if (nx < 0 || nx >= width || ny < 0 || ny >= height || !selected[ny * width + nx]) {
                  const d = Math.sqrt(dx*dx + dy*dy);
                  if (d < minDist) minDist = d;
                }
              }
            }
            
            const alpha = (minDist / featherDepth); // 0 at edge, 1 deep inside
            data[idx * 4 + 3] = Math.floor(data[idx * 4 + 3] * (1 - alpha));
          }
        }
      }

      return imgData;
    }
  </script>
</body>
</html>
