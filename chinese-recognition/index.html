<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw & Recognize Chinese Character</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      background: #f0f2f5;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 350px;
    }

    #canvas {
      border: 3px solid #333;
      border-radius: 8px;
      background: #fff;
      cursor: crosshair;
      touch-action: none;
      margin-bottom: 15px;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-run {
      background: #28a745;
      color: white;
    }

    .btn-clear {
      background: #dc3545;
      color: white;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #status {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
    }

    #result-label {
      font-size: 14px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #result {
      font-size: 80px;
      margin: 10px 0;
      color: #007bff;
      font-weight: bold;
      min-height: 100px;
    }

    .debug-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      text-align: left;
      display: none;
      width: 100%;
    }

    .debug-section.visible {
      display: block;
    }

    #debugCanvas {
      border: 1px solid #ccc;
      background: white;
      margin-top: 5px;
      image-rendering: pixelated;
    }

    .debug-meta {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      color: #444;
      border: 1px solid #e9ecef;
    }

    .debug-toggle {
      font-size: 12px;
      color: #007bff;
      cursor: pointer;
      margin-top: 15px;
      display: block;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2 style="margin-top: 0;">Handwritten OCR</h2>
    <div id="status">Loading AI Engine...</div>

    <canvas id="canvas" width="256" height="256"></canvas>

    <div class="controls">
      <button class="btn-clear" onclick="clearCanvas()">Clear</button>
      <button id="runBtn" class="btn-run" onclick="runOCR()" disabled>Recognize</button>
    </div>

    <div id="result-label">Prediction</div>
    <div id="result">--</div>

    <span class="debug-toggle" onclick="toggleDebug()">⚙️ Show Debug Info</span>
    <div id="debugSection" class="debug-section">
      <div style="font-size: 11px; font-weight: bold; color: #666; margin-bottom: 5px;">Input View (48px height)</div>
      <canvas id="debugCanvas"></canvas>
      <div id="debugMeta" class="debug-meta">--</div>
    </div>
  </div>

  <script>
    let recSession;
    let charDict = [];
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const runBtn = document.getElementById('runBtn');
    const status = document.getElementById('status');
    const resultDiv = document.getElementById('result');

    // Canvas Drawing Logic
    let drawing = false;
    ctx.lineWidth = 12;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#000';

    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.absLeft || clientX - rect.left, y: clientY - rect.top };
      // Corrected logic for position calculation
    };

    // Re-implementing getPos correctly to avoid issues with scrolling/offset
    const getCorrectPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    };

    const start = (e) => { drawing = true; draw(e); };
    const stop = () => { drawing = false; ctx.beginPath(); };
    const draw = (e) => {
      if (!drawing) return;
      const pos = getCorrectPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    };

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stop);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); start(e); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); stop(e); }, { passive: false });

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      resultDiv.innerText = "--";
    }

    // Load Resources
    async function init() {
      try {
        const resp = await fetch('./ppocr_keys_v1.txt');
        if (!resp.ok) throw new Error("Failed to load dictionary");
        const text = await resp.text();
        charDict = text.split(/\r?\n/).filter(line => line.trim() !== "");

        // Note: Using the provided logic for session creation
        // We'll try to find the model file in the adjacent folder as requested
        const modelPath = './rec.onnx';

        // Since we are working in a workspace, let's assume the user placed it in models/
        const res = await ort.InferenceSession.create(modelPath, { executionProviders: ['wasm'] });
        recSession = res;

        status.innerText = "Ready! Draw a character.";
        runBtn.disabled = false;
      } catch (e) {
        console.error(mode_error_trace_placeholder); // Placeholder for debugging
        status.innerText = "Load Error: Check console";
        console.error(e);
      }
    }

    function toggleDebug() {
      const sec = document.getElementById('debugSection');
      sec.classList.toggle('visible');
      const toggle = document.querySelector('.debug-toggle');
      toggle.innerText = sec.classList.contains('visible') ? "⚙️ Hide Debug Info" : "⚙️ Show Debug Info";
    }

    async function runOCR() {
      if (!recSession) return;
      status.innerText = "Thinking...";

      // 1. Create an off-screen canvas to resize to model input (48px height)
      const offscreen = document.createElement('canvas');
      const oCtx = offscreen.getContext('2d');

      // PaddleOCR models usually expect 48px height
      const targetHeight = 48;
      const ratio = targetHeight / canvas.height;
      offscreen.height = targetHeight;
      offscreen.width = canvas.width * ratio;

      // Fill white background (crucial for OCR)
      oCtx.fillStyle = "white";
      oCtx.fillRect(0, 0, offscreen.width, offscreen.height);

      // Add 4px vertical padding (8px total) so character doesn't touch top/bottom
      // This often improves recognition significantly for hand-drawn characters
      const pad = 8;
      const innerH = targetHeight - pad * 2;
      const innerW = canvas.width * (innerH / canvas.height);
      const offsetX = (offscreen.width - innerW) / 2;
      oCtx.drawImage(canvas, offsetX, pad, innerW, innerH);

      // Update Debug UI
      const debugCanvas = document.getElementById('debugCanvas');
      debugCanvas.width = offscreen.width;
      debugCanvas.height = offscreen.height;
      debugCanvas.getContext('2d').drawImage(offscreen, 0, 0);
      document.getElementById('debugMeta').innerText = `Input Shape: [1, 3, ${offscreen.height}, ${offscreen.width}]\nDictionary: ${charDict.length} chars`;

      const imgData = oCtx.getImageData(0, 0, offscreen.width, offscreen.height);
      const inputTensor = preprocess(imgData);

      try {
        const feeds = { 'x': inputTensor };
        const output = await recSession.run(feeds);
        const outputTensor = Object.values(output)[0];
        const prediction = outputTensor.data;
        const dims = outputTensor.dims;

        let recognizedText = "";
        let lastIdx = -1;
        const seqLen = dims[1];
        const numClasses = dims[2];

        for (let i = 0; i < seqLen; i++) {
          let maxIdx = 0;
          let maxProb = -Infinity;
          for (let j = 0; j < numClasses; j++) {
            const prob = prediction[i * numClasses + j];
            if (prob > maxProb) {
              maxProb = prob;
              maxIdx = j;
            }
          }
          if (maxIdx > 1 && maxIdx !== lastIdx) {
            if (charDict[maxIdx - 2]) recognizedText += charDict[maxIdx - 2];
          }
          lastIdx = maxIdx;
        }

        resultDiv.innerText = recognizedText || "??";
        status.innerText = "Ready";
      } catch (e) {
        console.error(e);
        status.innerText = "Inference Error";
      }
    }

    function preprocess(imgData) {
      const { width, height, data } = imgData;
      const floatData = new Float32Array(3 * width * height);
      for (let i = 0; i < width * height; i++) {
        // PaddleOCR standard normalization: (x / 255 - 0.5) / 0.5
        floatData[i] = (data[i * 4] / 255 - 0.5) / 0.5;
        floatData[i + width * height] = (data[i * 4 + 1] / 255 - 0.5) / 0.5;
        floatData[i + 2 * width * height] = (data[i * 4 + 2] / 255 - 0.5) / 0.5;
      }
      return new ort.Tensor('float32', floatData, [1, 3, height, width]);
    }

    init();
  </script>
</body>

</html>
