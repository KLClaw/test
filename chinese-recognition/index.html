<!DOCTYPE html>
<html lang="en">
<head>

 <title>Draw & Recognize Chinese Character</title>

 <style>
 body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; background: #f0f2f5; }
 .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 350px; }
 #canvas { border: 3px solid #333; border-radius: 8px; background: #fff; cursor: crosshair; touch-action: none; margin-bottom: 15px; }
 .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
 button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
 .btn-run { background: #28a745; color: white; }
 .btn-clear { background: #dc3545; color: white; }
 button:disabled { background: #ccc; cursor: not-allowed; }
 #status { font-size: 13px; color: #666; margin-bottom: 10px; }
 #result-label { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
 #result { font-size: 80px; margin: 10px 0; color: #007bff; font-weight: bold; min-height: 100px; }
 </style>
</head>
<body>

<div class="card">
 <h2 style="margin-top: 0;">Handwritten OCR</h2>
 <div id="status">Loading AI Engine...</div>

 <canvas id="canvas" width="256" height="256"></canvas>

 <div class="controls">
 <button class="btn-clear" onclick="clearCanvas()">Clear</button>
 <button id="runBtn" class="btn-run" onclick="runOCR()" disabled>Recognize</button>
 </div>

 <div id="result-label">Prediction</div>
 <div id="result">--</div>
</div>

 return { x: clientX - rect.absLeft || clientX - rect.left, y: clientY - rect.top };

 // Re-implementing getPos correctly to avoid issues with scrolling/offset
 const getCorrectPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { 
        x: clientX - rect.left, 
        y: clientY - rect.top 
    };
 };

 const draw = (e) => {
 if (!drawing) return;
 const pos = getCorrectPos(e);
 ctx.lineTo(pos.x, pos.y);
 ctx.stroke();
 ctx.beginPath();
 ctx.moveTo(pos.x, pos.y);
 };

 canvas.addEventListener('mousedown', start);
 canvas.addEventListener('mousemove', draw);
 window.addEventListener('mouseup', stop);
 canvas.addEventListener('touchstart', (e) => { e.preventDefault(); start(e); }, {passive: false});
 canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, {passive: false});
 canvas.addEventListener('touchend', (e) => { e.preventDefault(); stop(e); }, {passive: false});

 function clearCanvas() {
 ctx.clearRect(0, 0, canvas.width, canvas.height);
 resultDiv.innerText = "--";
 }

 charDict = text.split(/\r?\n/).filter(line => line.trim() !== "");

 const modelPath = './rec.onnx'; 

 // Since we are working in a workspace, let's assume the user placed it in models/
 const res = await ort.InferenceSession.create(modelPath, { executionProviders: ['wasm'] });
 recSession = res;

 } catch (e) {

 }
 }

 } catch (e) {
     console.error(e);
     status.innerText = "Inference Error";
 }
 }

 function preprocess(imgData) {
 const { width, height, data } = imgData;
 const floatData = new Float32Array(3 * width * height);
 for (let i = 0; i < width * height; i++) {
 // Normalize (standard ImageNet)
 floatData[i] = (data[i * 4] / 255 - 0.485) / 0.229;
 floatData[i + width * height] = (data[i * 4 + 1] / 255 - 0.456) / 0.224;
 floatData[i + 2 * width * height] = (data[i * 4 + 2] / 255 - 0.406) / 0.225;
 }
 return new ort.Tensor('float32', floatData, [1, 3, height, width]);

</body>
</html>
