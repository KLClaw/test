<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merger</title>
    <!-- Link to global styles -->
    <link rel="stylesheet" href="../styles.css">
    <!-- Load pdf-lib from CDN -->
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body style="padding-top: 2rem; display: block; align-items: flex-start;">

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <a href="../index.html" class="back-btn">← Back to Menu</a>
    <h2 style="margin-top: 10px;">PDF Merger</h2>
    <p>Upload multiple PDFs, reorder them, and merge into one file.</p>

    <div style="border: 2px dashed #ccc; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px;">
        <input type="file" id="fileInput" multiple accept=".pdf" style="display: none;">
        <button onclick="document.getElementById('fileInput').click()">📁 Select PDF Files</button>
    </div>

    <div id="fileListContainer">
        <ul id="fileList" style="list-style: none; padding: 0; margin: 0;"></ul>
    </div>

    <div id="actions" style="margin-top: 20px; display: none;">
        <button id="mergeBtn" onclick="mergePdfs()">🚀 Merge & Download</button>
    </div>

    <div id="result" style="margin-top: 1.5rem; padding: 1rem; border-radius: 8px; display: none; font-weight: bold; text-align: center;"></div>
</div>

<script>
    let selectedFiles = [];

    const fileInput = document.getElementById('fileInput');
    const listElement = document.getElementById('fileList');
    const actionsDiv = document.getElementById('actions');
    const resultDiv = document.getElementById('result');

    fileInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        files.forEach(file => {
            if (file.type === 'application/pdf') {
                selectedFiles.push({
                    name: file.name,
                    data: file
                });
            }
        });

        renderList();
    });

    function renderList() {
        listElement.innerHTML = '';
        
        if (selectedFiles.length === 0) {
            actionsDiv.style.display = 'none';
            return;
        }

        actionsDiv.style.display = 'block';

        selectedFiles.forEach((file, index) => {
            const li = document.createElement('li');
            li.style.cssText = `
                background: #f9f9f9;
                padding: 10px;
                margin-bottom: 8px;
                border-radius: 6px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border: 1px solid #eee;
            `;

            li.innerHTML = `
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; font-size: 0.85rem; color: #333;" title="${file.name}">
                    📄 ${file.name}
                </span>
                <div style="display: flex; gap: 5px;">
                    <button onclick="move(${index}, -1)" style="padding: 4px 8px; width: auto; background: #6c757d; font-size: 0.8rem;" ${index === 0 ? 'disabled' : ''}>↑</button>
                    <button onclick="move(${index}, 1)" style="padding: 4px 8px; width: auto; background: #6c757d; font-size: 0.8rem;" ${index === selectedFiles.length - 1 ? 'disabled' : ''}>↓</button>
                    <button onclick="removeFile(${index})" style="padding: 4px 8px; width: auto; background: #dc3545; font-size: 0.8rem;">✕</button>
                </div>
            `;
            listElement.appendChild(li);
        });
    }

    function move(index, direction) {
        const newIndex = index + direction;
        if (newIndex < 0 || newIndex >= selectedFiles.length) return;
        
        const temp = selectedFiles[index];
        selectedFiles[index] = selectedFiles[newIndex];
        selectedFiles[newIndex] = temp;
        renderList();
    }

    function removeFile(index) {
        selectedFiles.splice(index, 1);
        renderList();
    }

    async function mergePdfs() {
        if (selectedFiles.length < 2) {
            showResult(false, "Please select at least 2 PDF files to merge.");
            return;
        }

        showResult(true, "⏳ Merging... please wait.");

        try {
            const { PDFDocument } = window.PDFLib;
            const mergedPdf = await PDFDocument.create();

            for (const fileObj of selectedFiles) {
                const arrayBuffer = await fileObj.data.arrayBuffer();
                const pdfDoc = await PDFDocument.load(arrayBuffer);
                const copiedPages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
                copiedPages.forEach((page) => mergedPdf.addPage(page));
            }

            const pdfBytes = await mergedPdf.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = "merged_document.pdf";
            link.click();

            showResult(true, "✅ Success! Download started.");
        } catch (err) {
            console.error(err);
            showResult(false, "❌ Error: " + err.message);
        }
    }

    function showResult(isValid, message) {
        const resDiv = document.getElementById('result');
        resDiv.innerHTML = message;
        resDiv.style.display = 'block';
        resDiv.className = isValid ? 'valid' : 'invalid';
    }
</script>

</body>
</html>
